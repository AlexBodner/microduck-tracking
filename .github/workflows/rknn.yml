name: RKNN conversion

# Can YOLO-Lite reach Microduck's NPU? rknn-toolkit2 only runs on Linux
# x86_64, so this answers it on a runner rather than on a laptop.

on:
  workflow_dispatch:
  push:
    paths:
      - "edge/**"
      - ".github/workflows/rknn.yml"

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Clone YOLO-Lite
        run: git clone --depth 1 https://github.com/roboflow/yololite.git

      - name: Export edge_n to raw ONNX
        run: |
          python -m venv .export
          .export/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          .export/bin/pip install -q timm onnx onnxscript
          .export/bin/python edge/export_yololite_onnx.py \
            --yololite yololite --variant edge_n --img-size 320 \
            --out edge_n_320_raw.onnx

      # rknn-toolkit2 calls onnx.mapping, removed in onnx 1.16, and breaks on
      # numpy 2. It gets its own environment for that reason.
      - name: Compile to RKNN for rk3566
        run: |
          python -m venv .rknn
          .rknn/bin/pip install -q rknn-toolkit2 pillow "onnx==1.15.0" "numpy<2"
          .rknn/bin/python edge/convert_rknn.py \
            --onnx edge_n_320_raw.onnx --target rk3566 --img-size 320 \
            2>&1 | tee rknn_build.log

      - name: Report operator placement
        if: always()
        run: |
          echo "## RKNN conversion" >> $GITHUB_STEP_SUMMARY
          grep -E "^RESULT" rknn_build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -iE "not support|unsupported|fallback|cpu|subgraph" rknn_build.log \
            | head -40 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rknn-conversion
          path: |
            edge_n_320_raw.onnx
            rknn_build/*.rknn
            rknn_build.log
